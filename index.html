<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Unicorn Bank – Sign-in</title>
    <meta name="description" content="Unicorn Bank is a deliberately insecure mock online bank for hands-on web security training. Find the flaws, break in and move the money offshore. No real bank, no real money."/>

    <meta property="og:site_name" content="Unicorn Bank"/>
    <meta property="og:locale" content="en_US"/>
    <meta property="og:url" content="https://unicorn-bank.sunken.dev/"/>
    <meta property="og:title" content="Unicorn Bank – Sign-in"/>
    <meta property="og:description" content="Unicorn Bank is a deliberately insecure mock online bank for hands-on web security training. Find the flaws, break in and move the money offshore. No real bank, no real money."/>
    <meta property="og:image" content="https://unicorn-bank.sunken.dev/img/og-image.png"/>
    <meta property="og:image:type" content="image/png"/>
    <meta property="og:image:width" content="2400"/>

    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="Unicorn Bank – Sign-in"/>
    <meta name="twitter:description" content="Unicorn Bank is a deliberately insecure mock online bank for hands-on web security training. Find the flaws, break in and move the money offshore. No real bank, no real money."/>
    <meta name="twitter:image" content="https://unicorn-bank.sunken.dev/img/og-image.png"/>
    <meta name="twitter:image:alt" content="Unicorn Bank logo next to the tagline: a deliberately insecure online bank for hands-on web security training."/>
    <link rel="icon" href="./img/unicorn-logo.svg" />
    <link type="text/css" rel="stylesheet" href="./css/unicorn.css"/>
    <script type="application/javascript" src="./js/index.js"></script>
</head>
<body class="background">
<div class="login-bounding-box-centered">
    <div class="login-content">
        <div class="login-bounding-box-header">
            <img class="login-bounding-box-header-logo" src="./img/unicorn-logo.svg" alt="Unicorn Bank Logo"/>
            <h2 class="login-bounding-box-header-text">Sign-in to<br/>Unicorn Bank</h2>
        </div>
        <form
                id="authentication"
                class="login-form"
                onsubmit="return authenticate()"
                method="GET"
        >
            <div>
                <label for="username" class="login-input-label">Username</label>
                <div class="login-input-grouping">
                    <input
                            id="username"
                            name="username"
                            type="text"
                            class="login-input-control"
                            autocomplete="off"
                    >
                </div>
            </div>
            <div>
                <label for="password" class="login-input-label">Password</label>
                <div class="login-input-grouping">
                    <input type="password"
                           id="password"
                           name="password"
                           class="login-input-control"
                           autocomplete="off"
                    >
                </div>
            </div>
            <input type="hidden" name="isAdmin" value="false"/>
            <div>
                <button type="submit"
                        class="login-submit"
                        disabled
                >
                    Sign-in
                </button>
            </div>
        </form>
    </div>

    <div id="sign-in-error" class="modal-container" aria-labelledby="modal-title" role="dialog" aria-modal="true"
         hidden="hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-screen">
            <div class="modal-wrapper">
                <div class="modal-box">
                    <button type="button" class="modal-button-close" onclick="toggleModal('sign-in-error')">
                        <img class="icon" src="./img/close.svg" alt="Close"/>
                    </button>
                    <div>
                        <div class="icon-wrapper modal-color-error">
                            <img class="icon modal-color-error" src="./img/error.svg" alt="Error icon">
                        </div>
                        <div class="modal-text-wrapper">
                            <h3 class="modal-title" id="modal-title">Sign-in error!</h3>
                            <p class="modal-text">The entered combination of username and password is wrong.</p>
                        </div>
                    </div>
                    <div class="modal-button-wrapper">
                        <button type="button"
                                class="modal-button-error"
                                onclick="toggleModal('sign-in-error')">
                            Back to Sign-in
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
